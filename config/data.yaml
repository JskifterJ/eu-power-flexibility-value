# Data sources, date ranges and the sealed-holdout declaration.
#
# All dates are UTC calendar dates, interpreted as [start, end] inclusive of
# whole days: the fetch window for a year Y is [Y-01-01T00:00Z, Y+1-01-01T00:00Z).

schema_version: 1

# ---------------------------------------------------------------------------
# Splits (PLAN.md "Training/test split")
# ---------------------------------------------------------------------------
splits:
  train:
    years: [2019, 2020, 2021, 2022, 2023]
    note: >
      Exogenous (ENTSO-E forecast) features only from 2022 onward — no archived
      D-1 forecast vintages exist earlier. Price-history features span the whole
      window.
  validate:
    years: [2024]
    note: Visible. May be used to iterate on models.
  holdout:
    years: [2025]
    sealed: true
    note: >
      SEALED. Do not fetch, load, read, feature-engineer from, train on, or
      compute any metric against these years until PROGRESS.md records that
      Checkpoint C (C16) has been explicitly approved by the human. Enforced in
      code by data/holdout.py; the approval marker string is below.

# The exact line that must be present in PROGRESS.md before any sealed year may
# be touched. Written only by a human, never by an agent cycle.
holdout_unseal_marker: "CHECKPOINT C APPROVED: 2025 holdout unsealed"

# Years to fetch in ordinary (non-holdout) cycles. Deliberately stops at 2024:
# 2025 is sealed, and 2026 is outside the study window (the main hourly backtest
# ends 2025-09-30, the day before the SDAC 15-minute go-live).
fetch_years: [2019, 2020, 2021, 2022, 2023, 2024]

# ---------------------------------------------------------------------------
# Structural dates
# ---------------------------------------------------------------------------
structural_dates:
  sdac_15min_golive: "2025-10-01"   # market time unit 60min -> 15min
  main_backtest_end: "2025-09-30"   # last day of the main hourly backtest
  day_ahead_gate_closure_local: "12:00"  # CET/CEST, D-1; see features.yaml
  # Added in C3, needed by the gate-closure leakage guard (forecast/timing.py).
  # Nothing above was changed or weakened; these only name constants the guard
  # already depended on implicitly.
  day_ahead_gate_closure_tz: "Europe/Brussels"
  # Conservative upper bound on SDAC day-ahead results publication (~12:42-13:00
  # CET on D-1). The guard's correctness depends ONLY on the ordering
  #   gate_closure(D) < publication(D) < gate_closure(D+1),
  # not on the exact minute: prices for delivery day D become public AFTER gate
  # closure for day D, so at gate closure for D a bidder knows every hour of
  # market days <= D-1 and no hour of day D.
  day_ahead_results_published_local: "13:00"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  energy_charts:
    base_url: "https://api.energy-charts.info"
    price_endpoint: "/price"
    requires_key: false
    licence: "CC BY 4.0"
    attribution: "Data: Energy-Charts (Fraunhofer ISE), CC BY 4.0"
    # Politeness: the API is free and unauthenticated. One request per
    # (zone, year), never re-requested once cached (see CLAUDE.md).
    request:
      timeout_seconds: 120
      sleep_between_requests_seconds: 2.0
      max_retries: 3                 # transport/5xx errors only, exponential backoff
      retry_backoff_seconds: [5, 15, 45]
    cache_dir: "data/raw/energy_charts/price"
  entsoe:
    base_url: "https://web-api.tp.entsoe.eu/api"
    requires_key: true
    key_env_var: "ENTSOE_API_KEY"
    licence: "ENTSO-E Transparency Platform reuse conditions — attribution required"
    attribution: "Data: ENTSO-E Transparency Platform"
    first_used_in_cycle: "C7"
    cache_dir: "data/raw/entsoe"
    # Tier-A exogenous features start in 2022: no archived D-1 forecast vintage
    # exists earlier (PLAN.md "Training/test split", features.yaml
    # `available_from`). The API *will* answer for 2019-2021, so this bound is
    # enforced in code rather than left to a caller's memory.
    exogenous_available_from_year: 2022
    request:
      # Full-year A69 documents are ~13 MB of XML for DE-LU, so the timeout is
      # generous; the window is one calendar year because the platform rejects
      # anything larger than P1Y for these document types (observed in C7:
      # HTTP 400 + Acknowledgement_MarketDocument, Reason code 999).
      timeout_seconds: 300
      sleep_between_requests_seconds: 3.0
      max_retries: 3                 # transport/429/5xx only, exponential backoff
      retry_backoff_seconds: [5, 15, 45]
      max_window: P1Y
    expected_unit: MAW               # megawatt; anything else is a FLAG
    # C8: the *publication clock* of each document, declared so the C3
    # gate-closure guard can check these columns instead of trusting the prose
    # in `leakage_note`. `published_day_offset: -1` with `published_local:
    # "18:00"` reads "the forecast for market day D was public at 18:00 local on
    # D-1". These are facts about the source, which is why they live here beside
    # the document that has them, and they are what makes the FLAGGED status of
    # A69 *measurable* (18:00 on D-1 is after gate closure at 12:00 on D-1)
    # rather than only asserted.
    publication_tz: "Europe/Brussels"
    # The two document types PLAN.md C7 asks for. `domain_param` differs between
    # them (A65 is an out-zone load document, A69 an in-zone generation
    # document) and getting it wrong yields an empty Acknowledgement, so it is
    # declared here rather than inferred.
    #
    # `series` maps ENTSO-E psrTypes onto the feature column each one rolls up
    # into. An empty `psr_types` list means the document carries no MktPSRType
    # at all (true of A65). psrTypes seen in a response but absent from this
    # mapping are a FLAG, never silently dropped.
    documents:
      load_forecast_da:
        document_type: A65
        process_type: A01
        domain_param: outBiddingZone_Domain
        title: "Art. 6.1.B day-ahead total load forecast"
        expected_business_types: [A04]
        leakage_status: safe
        leakage_note: >
          Published at latest 2h before day-ahead gate closure, so the archived
          vintage is information a bidder genuinely held. Safe.
        # Art. 6.1.B requires publication at the latest two hours before the
        # day-ahead gate closes. The *latest* permitted instant is taken, not a
        # typical one: a guard built on an optimistic publication time would
        # pass a column that a real bidder was still waiting for.
        published_day_offset: -1
        published_local: "10:00"
        series:
          load_forecast_da_mw:
            psr_types: []
            non_negative: true
      wind_solar_forecast_da:
        document_type: A69
        process_type: A01
        domain_param: in_Domain
        title: "Art. 14.1.D day-ahead generation forecast for wind and solar"
        expected_business_types: [A93, A94]
        leakage_status: FLAGGED
        leakage_note: >
          The Art. 14 D-1 forecast is published at 18:00 on D-1 — AFTER
          day-ahead gate closure — and is revised intraday, so the archived
          vintage is NOT what a bidder had. Usable only alongside the mandatory
          C8 degradation sensitivity, and stated in the write-up's Limits.
        # 18:00 local on D-1 — six hours AFTER gate closure. Declaring it is the
        # point: with this here, the guard *finds* the violation on every
        # as-published row, and C8's degradation experiment measures what the
        # violation is worth instead of arguing about it.
        published_day_offset: -1
        published_local: "18:00"
        series:
          solar_forecast_da_mw:
            psr_types: [B16]
            non_negative: true
          wind_forecast_da_mw:
            psr_types: [B18, B19]   # offshore + onshore, summed
            non_negative: true
    # Curve types this project knows how to read. A01 is a fixed-size sequence
    # (every position present); A03 is a variable-sized block curve, where an
    # omitted position means "the previous point's value still holds". Every
    # response observed in C7 is A03, and naive position->row parsing of an A03
    # curve silently drops the repeated blocks — see docs/entsoe_layer.md.
    supported_curve_types: [A01, A03]

# ---------------------------------------------------------------------------
# Time-handling contract (asserted in tests from C2)
# ---------------------------------------------------------------------------
time:
  internal_timezone: UTC
  expected_rows_per_utc_day_hourly: 24
  # UTC days always have 24 hours. Local-clock DST days (23h/25h) are a
  # presentation/feature concern only; the DST whitelist in C2 exists to assert
  # that a *local-calendar* day's row count is one of {23, 24, 25} and matches
  # the transition calendar, rather than silently reindexing.
  dst_transition_local_day_lengths: [23, 24, 25]
